[versions]
junit = "6.1.3"
assertj = "3.27.7"
snakeyaml-engine = "3.1.1"
paper-api = "1.21.11-R0.1-SNAPSHOT"
errorprone-core = "2.50.0"
google-java-format = "1.36.1"
jacoco = "0.8.15"
# plugins
errorprone-plugin = "5.1.1"
spotless = "8.10.2"
shadow = "9.6.1"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone-core" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
