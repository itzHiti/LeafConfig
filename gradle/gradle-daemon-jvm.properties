#This file is read by the Gradle launcher to select the JVM of the build daemon.
#The build runs Spotless (google-java-format needs Java 21) inside the daemon, so a daemon started
#from an older JAVA_HOME fails and can poison the build cache. No download URLs: Gradle picks an
#installed Java 21 (JAVA_HOME, ~/.jdks, standard install locations) or fails with a clear message.
toolchainVersion=21
