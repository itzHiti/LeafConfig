org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Last release on Maven Central; apiCompatibility compares the published modules against it.
leafconfig.apiBaseline=0.3.2
# Deliberate binary-incompatible changes since the baseline (japicmp exclude patterns, ';'-separated).
# Allowed only before 1.0, each listed in CHANGELOG.md; cleared whenever the baseline moves.
leafconfig.apiAcceptedBreaks=dev.leafconfig.ConfigHandle#onReload(java.util.function.Consumer);dev.leafconfig.ConfigDiagnostic#at(java.lang.Integer,java.lang.Integer)
