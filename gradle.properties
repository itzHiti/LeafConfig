org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Last release on Maven Central; apiCompatibility compares the published modules against it.
leafconfig.apiBaseline=0.4.0
