name: Docs

# CI skips documentation-only changes, but every java block in README.md and docs/ must match
# compiled code. This runs only that check when markdown changes.
on:
  push:
    branches: [main]
    paths:
      - "**.md"
  pull_request:
    paths:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snippets:
    name: Documentation snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :leafconfig-example:test --tests dev.leafconfig.example.DocumentationSnippetsTest
