name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central staging
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Fail before building: SNAPSHOT versions cannot go to Central, and a tag must name the
      # version that build.gradle.kts declares.
      - name: Check release version
        run: |
          version="$(sed -n 's/^ *version = "\([^"]*\)".*/\1/p' build.gradle.kts | head -1)"
          echo "build.gradle.kts version: $version"
          case "$version" in
            *-SNAPSHOT|"") echo "::error::version '$version' is not releasable; set a release version in build.gradle.kts first"; exit 1 ;;
          esac
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version v$version"; exit 1
          fi
      - run: ./gradlew clean check
      # SIGNING_KEY_B64 is the ASCII-armored private key, base64-encoded into one line, so the
      # secret cannot be damaged by copy-paste. It is decoded into a multi-line Gradle property.
      - name: Check secrets and decode signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          fail=0
          for name in SIGNING_KEY_B64 SIGNING_KEY_PASSWORD MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::secret $name is empty or not visible to this job; define it in the 'release' environment or at repository level"
              fail=1
            else
              echo "$name: ${#value} chars"
            fi
          done
          [ "$fail" = 0 ] || exit 1
          key="$(printf '%s' "$SIGNING_KEY_B64" | tr -d ' \r\n' | base64 -d)"
          echo "decoded key: $(printf '%s\n' "$key" | wc -l) lines, first line: $(printf '%s\n' "$key" | head -1)"
          case "$key" in
            "-----BEGIN PGP PRIVATE KEY BLOCK-----"*) ;;
            *) echo "::error::SIGNING_KEY_B64 does not decode to an ASCII-armored private key"; exit 1 ;;
          esac
          {
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<LEAFCONFIG_KEY_EOF"
            printf '%s\n' "$key"
            echo "LEAFCONFIG_KEY_EOF"
          } >> "$GITHUB_ENV"
      - run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-jars
          path: "*/build/libs/*.jar"
